spring:
  application:
    name: zylos-infra-gateway

  # Reactor automatic context propagation required so the security starter's
  # reactive MDC enrichment (correlation_id, subject) bridges into log MDC.
  reactor:
    context-propagation: auto

  cloud:
    gateway:
      server:
        webflux:
          # Trust forwarded headers only from in-cluster proxies. Setting this
          # activates the Forwarded and X-Forwarded-* header filters (off by
          # default since Spring Cloud 2025.0). Default targets kind's pod CIDR;
          # override per-environment. Tighten in production to the mesh's egress
          # range.
          trusted-proxies: '${ZYLOS_TRUSTED_PROXIES:10\.244\..*}'

          # Filters applied to every route.
          default-filters:
            # The gateway is Bearer-token based; downstream services are
            # token-authenticated and never read cookies. Strip Cookie on the
            # way in so no browser cookie is ever forwarded to an internal
            # service.
            - RemoveRequestHeader=Cookie

          routes:
            - id: hello-service
              uri: ${ZYLOS_HELLO_SERVICE_URI:http://zylos-service-hello.zylos-services.svc.cluster.local:8080}
              predicates:
                - Path=/api/v1/hello/**
              filters:
                - name: TokenExchange
                  args:
                    audience: zylos-internal-hello
                    scope: hello-aud

zylos:
  security:
    issuer-uri: ${ZYLOS_ISSUER_URI:http://keycloak.keycloak.svc.cluster.local:8080/realms/zylos}
    expected-audience: zylos-gateway
    actor-chains:
      # Gateway is the ingress hop; ingress tokens have no act claim to match.
      enabled: false
  gateway:
    token-exchange:
      client-id: ${ZYLOS_GATEWAY_CLIENT_ID:zylos-gateway}
      # Injected from a Kubernetes secret in the cluster; never commit a value.
      client-secret: ${ZYLOS_GATEWAY_CLIENT_SECRET:""}
      # Defaults to the issuer's standard Keycloak token endpoint.
      token-endpoint: ${ZYLOS_TOKEN_ENDPOINT:${zylos.security.issuer-uri}/protocol/openid-connect/token}
      cache:
        ttl: 90s
        max-size: 10000

server:
  port: 8080
  shutdown: graceful

management:
  server:
    # Actuator on a dedicated port. The zylos-service-base chart's liveness/
    # readiness/startup probes and ServiceMonitor target this management port,
    # keeping operational endpoints off the main (Bearer-secured) traffic port.
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
