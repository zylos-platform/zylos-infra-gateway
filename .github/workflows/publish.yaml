name: Publish

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (Jib, multi-arch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine floating tag based on the event trigger
          FLOATING_TAG="edge"
          if [ "${{ github.event_name }}" = "release" ]; then
            FLOATING_TAG="latest"
          fi

          ./mvnw -B -ntp -DskipTests compile jib:build \
            -Djib.to.image=ghcr.io/zylos-platform/zylos-infra-gateway:${{ steps.tag.outputs.tag }} \
            -Djib.to.tags=$FLOATING_TAG \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "Pushed ghcr.io/zylos-platform/zylos-infra-gateway:${{ steps.tag.outputs.tag }} (+ :latest)" >> "$GITHUB_STEP_SUMMARY"
