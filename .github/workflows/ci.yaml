name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-reusable:
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: zylos-platform/zylos-service-parent/.github/workflows/reusable-build-and-publish.yaml@main
    with:
      service-name: zylos-infra-gateway
      java-version: "25"
      coverage-threshold: "0.70"
      open-deploy-pr: true
    secrets:
      BOOTSTRAP_REPO_TOKEN: ${{ secrets.BOOTSTRAP_REPO_TOKEN }}

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
